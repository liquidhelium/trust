[package]
name = "trust-runtime"
description = "Runtime support layer for trust-generated Rust code: parameter destructuring, call protocol, closure construction, join/iteration semantics"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
typst = "0.15.1"
typst-syntax = "0.15.1"
typst-eval = "0.15.1"
comemo = "0.5.1"
unicode-segmentation = "1"
toml = "0.8"
ecow = "0.2"
