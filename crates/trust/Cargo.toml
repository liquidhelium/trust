[package]
name = "trust"
description = "Typst-to-Rust transpiler: compiles Typst packages into Rust crates that drive the typst-library value model"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
typst-kit = { workspace = true, features = ["system-packages", "system-downloader"] }
typst-syntax.workspace = true
# Package manifest (entrypoint parsing)
toml.workspace = true
walkdir = "2"
trust-runtime.workspace = true
# Output formatting (fmt module): parse the generated code back and
# pretty-print it — prettyplease for real Rust, our own layout for the
# runtime DSL macros. span-locations gives exact byte ranges outside a
# proc-macro context.
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "clone-impls"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
prettyplease = { version = "0.2", features = ["verbatim"] }
# Command-line interface
clap = { version = "4", features = ["derive"] }
