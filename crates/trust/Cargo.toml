[package]
name = "trust"
description = "Typst → Rust 转译器(nuitka 路线):把 typst 包编译为驱动 typst-library 值模型的 Rust crate"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
flate2 = "1"
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
# 前端与手翻基线(typst 0.15.1)同版,保证 AST/语义对齐
typst-syntax = "0.15.1"
# 包 manifest(entrypoint 解析)
toml = "0.8"
trust-runtime = { path = "../trust-runtime" }
