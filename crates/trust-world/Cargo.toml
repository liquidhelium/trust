[package]
name = "trust-world"
description = "Test infrastructure for trust: the InjectWorld used by the differential and official-suite harnesses, and the reference implementation of the host-integration contract (native module injection + package virtualization). Generated artifacts never link this crate"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
typst = "0.15.1"
typst-eval = "0.15.1"
typst-syntax = "0.15.1"
typst-layout = "0.15.1"
typst-library = "0.15.1"
typst-utils = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["datetime"] }
comemo = "0.5.1"
trust-runtime = { path = "../trust-runtime" }
