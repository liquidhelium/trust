[package]
name = "trust-world"
description = "Injected Typst World for trust: injects native modules through a custom World/Library without forking typst, and virtualizes packages"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
typst = "0.15.1"
typst-eval = "0.15.1"
typst-syntax = "0.15.1"
typst-layout = "0.15.1"
typst-library = "0.15.1"
typst-utils = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["datetime"] }
comemo = "0.5.1"
trust-runtime = { path = "../trust-runtime" }
