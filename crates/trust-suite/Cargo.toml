[workspace]
resolver = "3"
members = [".", "gencrate-*"]

[package]
name = "trust-suite"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "refresh"
path = "src/bin/refresh.rs"

[dependencies]
trust = { path = "../trust" }
trust-runtime = { path = "../trust-runtime" }
trust-world = { path = "../trust-world" }
typst = "0.15.1"
typst-syntax = "0.15.1"
typst-svg = "0.15.1"
typst-layout = "0.15.1"
comemo = "0.5.1"
ecow = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.typst-assets]
version = "0.15.1"
features = ["fonts"]

[dev-dependencies]
# BEGIN tcat deps
tcat-foundations-arguments = { path = "gencrate-foundations-arguments" }
