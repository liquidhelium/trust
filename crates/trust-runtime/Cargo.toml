[package]
name = "trust-runtime"
description = "机器翻译生成的 Rust 代码的运行时支撑层(参数解构、调用协议、闭包构造、join/迭代语义)"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
typst = "0.15.1"
typst-syntax = "0.15.1"
typst-eval = "0.15.1"
comemo = "0.5.1"
unicode-segmentation = "1"
toml = "0.8"
ecow = "0.2"
